[package]
name = "eh3d-stencilcam"
version = "0.0.4"
edition = "2021"
rust-version = "1.75"
description = "Solder paste stencils from the paste layer of a board: shrunk and rounded openings, laser kerf compensation, ratio checks and G-code or HP-GL cutting paths"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-STENCILCAM"
readme = "README.md"

[lib]
name = "eh3d_stencilcam"
path = "src/lib.rs"

[[bin]]
name = "eh3d-stencilcam"
path = "src/main.rs"

[features]
default = []
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png"]

[dependencies]
# the Gerber reader and the shapes of the apertures (path dependencies on the sibling repositories)
eh3d-parser-gerber = { version = ">=0.0.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gerber" }
eh3d-parser-gcode = { version = ">=0.0.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gcode" }
eh3d-gerberviewer ={ version = ">=0.0.1", path = "../EH3D-GERBERVIEWER" }

# the window
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[profile.release]
opt-level = 3
lto = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
