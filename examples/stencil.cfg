# EH3D-STENCILCAM settings
# the straight lead-in before each contour, tangent to its first segment (0 to 5 mm, 0 for none)
lead_in_mm = 0.3
# the straight lead-out after each contour, tangent to its last segment (0 to 5 mm, 0 for none)
lead_out_mm = 0.3
# the wait after the laser is switched on (0 to 60 seconds, 0 for none)
laser_wait_s = 0
# the speed of the moves with the laser off, to estimate the time of the job (100 to 100000 mm/min, 0 for no estimate)
rapid_mm_min = 0
# the leads of a round opening and of a rectangular one, when they are not the ones above (0 to 5 mm); take the # off to use them
# lead_in_round_mm = 0.3
# lead_out_round_mm = 0.3
# lead_in_rect_mm = 0.3
# lead_out_rect_mm = 0.3
# the speed of the cut (1 to 30000 mm/min)
feed_mm_min = 600
# the top of the laser power scale, the S of the G-code (1 to 100000)
smax = 1000
# how many times every contour is cut (1 to 10; more for a thick material)
passes = 1
# the narrowest web, the sheet that stays between two openings, that is not warned about (0 to 5 mm, 0 for no warning)
min_web_mm = 0.1
# the smallest aspect ratio, the smaller side of an opening over the thickness of the sheet, that releases the paste (0.5 to 10; 1.5 by the IPC guideline)
min_aspect = 1.5
# the smallest area ratio, the area of an opening over the area of its walls, that releases the paste (0.1 to 2; 0.66 by the IPC guideline)
min_area = 0.66
# a region (a pad drawn as an outline) that fills at least 100 minus this percent of its enclosing rectangle is opened as that rectangle (0 to 20; 0 opens only an exact rectangle)
region_fit_percent = 0
# the sheet of the stencil material in the table of sheets that the tool crib exports (export-sheets-csv): its thickness, reduction of the openings, kerf and ratio limits replace those of the material; take the # off to use it
# sheet_file = sheets.csv
# sheet_name = Mylar 0.12
