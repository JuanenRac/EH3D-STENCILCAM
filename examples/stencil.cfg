# EH3D-STENCILCAM settings
# the straight lead-in before each contour, tangent to its first segment (0 to 5 mm, 0 for none)
lead_in_mm = 0.3
# the straight lead-out after each contour, tangent to its last segment (0 to 5 mm, 0 for none)
lead_out_mm = 0.3
# the wait after the laser is switched on (0 to 60 seconds, 0 for none)
laser_wait_s = 0
# the speed of the moves with the laser off, to estimate the time of the job (100 to 100000 mm/min, 0 for no estimate)
rapid_mm_min = 0
# the leads of a round opening and of a rectangular one, when they are not the ones above (0 to 5 mm); take the # off to use them
# lead_in_round_mm = 0.3
# lead_out_round_mm = 0.3
# lead_in_rect_mm = 0.3
# lead_out_rect_mm = 0.3
# the speed of the cut (1 to 100000 mm/min)
feed_mm_min = 600
# the top of the laser power scale, the S of the G-code (1 to 100000)
smax = 1000
# how many times every contour is cut (1 to 10; more for a thick material)
passes = 1
